# Tests d'intégration Ocall School sur bases PostgreSQL JETABLES (conteneur de service, détruit avec le
# job). Déclenchement manuel. La CI n'utilise jamais Neon : aucun secret de base, aucune dérogation
# distante. La recette sur la base Neon School `test` se fait en local uniquement (pnpm school:recette:neon,
# identité de la base vérifiée explicitement) — voir docs/OCALL-SCHOOL.md § 7.
name: School tests (base jetable)

on:
  workflow_dispatch:

jobs:
  school-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ocall_suite_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocall_suite_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ocall_suite_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocall_suite_ci
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ocall_suite_ci
      TEST_SCHOOL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocall_school_ci
      # Bases locales du conteneur de service, détruites avec le job : déclarées jetables pour la garde.
      OCALL_TEST_EPHEMERAL_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate:deploy
      - name: Base School jetable et migrations (ajouts seuls)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE ocall_school_ci'
          pnpm db:school:migrate:deploy
        env:
          SCHOOL_ENABLED: 'true'
          SCHOOL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ocall_school_ci
      - name: Tests d'intégration School
        run: |
          pnpm --filter @ocall/api exec jest --runInBand --json --outputFile=school-results.json --testPathPattern 'test/school-.*\.integration\.spec\.ts$'
          node -e "const r=require('./apps/api/school-results.json');if(r.numPassedTests===0){console.error('Aucun test School execute.');process.exit(1)}"
